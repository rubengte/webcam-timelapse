name: Nightly Webcam Timelapse

on:
  schedule:
    # Runs at 00:02 UTC (01:02 AM Atlantic/Madeira Summer Time) converting yesterday's images into mp4 video
    - cron: '2 0 * * *'
  workflow_dispatch:

jobs:
  encode-timelapse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        cam: [portela, ribeira-brava, ponta-sol, pico-arieiro]
      fail-fast: false 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Process Timelapse for ${{ matrix.cam }}
        env:
          API_URL: ${{ secrets.TIMELAPSE_API_URL }} 
          KEY: ${{ secrets.TIMELAPSE_KEY }}
        run: |
          export TZ="Atlantic/Madeira"
          DATE=$(date -d "yesterday" +'%Y-%m-%d')
          
          echo "Starting job for ${{ matrix.cam }} on $DATE"
          mkdir frames && cd frames
          
          URLS=$(curl -s "$API_URL?action=list&cam=${{ matrix.cam }}&date=$DATE&key=$KEY")
          
          if [[ "$URLS" != *"["* ]]; then
            echo "No valid JSON returned or directory missing."
            exit 0
          fi
          
          # Download all images
          echo "$URLS" | jq -r '.[]' | xargs -n 1 -P 5 wget -q
          
          # Count total frames (both formats)
          COUNT=$(ls -1 *.jpg *.webp 2>/dev/null | wc -l)
          if [ "$COUNT" -lt 10 ]; then
            echo "Only $COUNT images found. Skipping video generation."
            exit 0
          fi
          
          # Create a chronological text file for FFmpeg containing all images
          ls -1 *.jpg *.webp 2>/dev/null | sort | while read filename; do echo "file '$filename'" >> frames.txt; done
          
          # Generate the video from the mixed list
          ffmpeg -r 10 -f concat -safe 0 -i frames.txt \
                 -c:v libx264 -crf 24 -preset fast -pix_fmt yuv420p \
                 -vf "scale='min(1920,iw)':-2" \
                 -y ../timelapse.mp4
                 
          cd ..
          
          if [ -f timelapse.mp4 ]; then
            OUTPUT_FILE="${{ matrix.cam }}-$DATE.mp4"
            mv timelapse.mp4 "$OUTPUT_FILE"

            echo "Publishing $OUTPUT_FILE to GitHub Releases..."
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            
            gh release view "daily-archive" || gh release create "daily-archive" --title "Daily Webcam Timelapses" --notes "Automated daily webcam timelapse archive"
            gh release upload "daily-archive" "$OUTPUT_FILE" --clobber

            echo "Triggering safe cleanup on server..."
            CLEANUP_RESPONSE=$(curl -s "$API_URL?action=cleanup&cam=${{ matrix.cam }}&date=$DATE&key=$KEY")
            echo "Server Response: $CLEANUP_RESPONSE"
          else
            echo "Error: MP4 file was not created by FFmpeg."
            exit 1
          fi

  keepalive-job:
    name: Prevent Workflow Pause
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
